version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
             arguments:
              values: ['completed', 'abandoned_cart']

  - name: stg_order_items
    columns:
      - name: order_id
        tests: [not_null]

  - name: stg_returns
    columns:
      - name: return_id
        tests: [unique, not_null]